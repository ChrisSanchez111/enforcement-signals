name: Weekly target list

on:
  schedule:
    # Every Monday, 11:17 UTC (6:17 AM Eastern in winter, 7:17 AM in summer)
    - cron: "17 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: pip install "pypdf>=5,<7"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect enforcement actions
        run: python src/collect.py
      - name: Commit results
        run: |
          git config user.name "enforcement-signals bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json targets/ data/fed_cache.json
          if git diff --cached --quiet; then
            echo "No changes this run."
          else
            git commit -m "Weekly target list $(date -u +%Y-%m-%d)"
            git push
          fi
