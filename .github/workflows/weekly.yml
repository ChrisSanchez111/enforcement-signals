name: Weekly target list

on:
  schedule:
    # GitHub often delays scheduled runs by hours, so run well before the
    # Monday ~8 AM ET email. Both times are Monday in UTC, so the data is
    # dated Monday.
    # Monday 00:41 UTC (Sunday 7:41 PM Eastern in winter, 8:41 PM in summer)
    - cron: "41 0 * * 1"
    # Backup: Monday 05:41 UTC (12:41 AM Eastern in winter, 1:41 AM in summer)
    - cron: "41 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF reader
        run: pip install "pypdf>=5,<7"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect enforcement actions
        run: python src/collect.py
      - name: Scan job boards for remediation hiring
        run: python src/jobs.py || echo "Job scan failed; continuing."
      - name: Commit results
        run: |
          git config user.name "enforcement-signals bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/jobs.json targets/ data/fed_cache.json data/occ_cache.json data/job_boards_cache.json
          if git diff --cached --quiet; then
            echo "No changes this run."
          else
            git commit -m "Weekly target list $(date -u +%Y-%m-%d)"
            git push
          fi
